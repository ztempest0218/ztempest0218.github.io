<head>
    <meta charset="utf-8">
    {% include security-policy.html %}
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>{% if page.title %}{{ page.title | capitalize }}{% else %}{{ site.title }}{% endif %}</title>
    <meta name="viewport" content="width=device-width">
    <meta name="description" content="{{ site.description }}">
    <link rel="canonical" href="{{ page.url | replace:'index.html','' | prepend: site.baseurl | prepend: site.url }}">

    <!-- Custom CSS & Bootstrap Core CSS - Uses Bootswatch Flatly Theme: http://bootswatch.com/flatly/ -->
    <link rel="stylesheet" href="{{ "/style.css" | prepend: site.baseurl }}">
    <link rel="stylesheet" href="{{ "/css/bootstrap-compat.css" | prepend: site.baseurl }}">

    <!-- Custom Fonts -->
    <link rel="stylesheet" href="{{ "/css/font-awesome/css/font-awesome.min.css" | prepend: site.baseurl }}">
    <link href="https://fonts.googleapis.com/css?family=Lora:400,700,400italic,700italic" rel="stylesheet" type="text/css">
    <link href="https://fonts.googleapis.com/css?family=Montserrat:400,700" rel="stylesheet" type="text/css">

    <!-- Slider -->
    <link rel="stylesheet" href="{{ "/ideal-image-slider/ideal-image-slider.css" | prepend: site.baseurl }}">
	<link rel="stylesheet" href="{{ "/ideal-image-slider/themes/default/default.css" | prepend: site.baseurl }}">
	<script src="{{ "/ideal-image-slider/ideal-image-slider.js" | prepend: site.baseurl }}"></script>
	<script src="{{ "/ideal-image-slider/extensions/captions/iis-captions.js" | prepend: site.baseurl }}"></script>
	<script src="{{ "/ideal-image-slider/extensions/bullet-nav/iis-bullet-nav.js" | prepend: site.baseurl }}"></script>

    <!-- Academic icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/jpswalsh/academicons@1/css/academicons.min.css">


 
</head>
